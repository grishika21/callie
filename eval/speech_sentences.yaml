  - {say: "Open a payment ticket for order thirty seventy two, she was charged twice.", ids: [3072], keywords: [payment, charged]}
  - {say: "Find the customer Travis Casey.", ids: [], keywords: [customer, travis]}
  - {say: "Does customer eleven thirty nine have any open tickets?", ids: [1139], keywords: [open, tickets]}
