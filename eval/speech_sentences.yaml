  - {say: "How many delivery tickets are still open?", ids: [], keywords: [delivery, open]}
  - {say: "Which carrier takes the longest, SwiftShip or ParcelPro?", ids: [], keywords: [swiftship, parcelpro]}
  - {say: "The parcel from NorthStar Freight never arrived.", ids: [], keywords: [northstar, arrived]}
